          cat > app/src/main/java/com/routine/app/MainActivity.java <<'EOF_3'
          package com.routine.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              static final String HOST = "appassets.androidplatform.net";
              WebView w;

              public class Bridge {
                  @JavascriptInterface
                  public void save(String json) {
                      Sched.store(MainActivity.this, json);
                      Sched.all(MainActivity.this);
                      RoutineWidget.refreshAll(MainActivity.this);
                  }
              }

              WebResourceResponse asset(Uri u) {
                  if (u == null || !HOST.equals(u.getHost())) return null;
                  String p = u.getPath();
                  if (p == null || p.length() < 2) p = "/index.html";
                  try {
                      InputStream in = getAssets().open(p.substring(1));
                      String mime = p.endsWith(".html") ? "text/html"
                              : p.endsWith(".js") ? "application/javascript"
                              : p.endsWith(".css") ? "text/css"
                              : p.endsWith(".png") ? "image/png"
                              : "application/octet-stream";
                      return new WebResourceResponse(mime, "utf-8", in);
                  } catch (IOException e) {
                      return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", null,
                              new ByteArrayInputStream(new byte[0]));
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  w = new WebView(this);
                  w.setBackgroundColor(0xFF070B1C);
                  getWindow().setStatusBarColor(0xFF070B1C);
                  getWindow().setNavigationBarColor(0xFF070B1C);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setAllowFileAccess(false);
                  w.getSettings().setAllowContentAccess(false);
                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return asset(r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception e) {
                          }
                          return true;
                      }
                  });
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("https://" + HOST + "/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (w.canGoBack()) w.goBack();
                  else finish();
              }
          }
          EOF_3
          cat > app/src/main/java/com/routine/app/Sched.java <<'EOF_4'
          package com.routine.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Sched {
              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("r", 0);
              }

              static void store(Context c, String json) {
                  p(c).edit().putString("d", json).apply();
              }

              static PendingIntent pi(Context c, int i, String s, String e, String t) {
                  Intent it = new Intent(c, Alarm.class);
                  it.putExtra("i", i);
                  it.putExtra("s", s);
                  it.putExtra("e", e);
                  it.putExtra("t", t);
                  return PendingIntent.getBroadcast(c, i, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void set(Context c, int i, String s, String e, String t) {
                  String[] h = s.split(":");
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, Integer.parseInt(h[0]));
                  cal.set(Calendar.MINUTE, Integer.parseInt(h[1]));
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis() + 1000) {
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pend = pi(c, i, s, e, t);
                  try {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pend);
                  } catch (SecurityException x) {
                      am.set(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pend);
                  }
              }

              static void all(Context c) {
                  try {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      int old = p(c).getInt("n", 0);
                      for (int i = 0; i < old; i++) {
                          am.cancel(pi(c, i, "", "", ""));
                      }
                      JSONArray a = new JSONArray(p(c).getString("d", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          if (o.optBoolean("n", true)) {
                              set(c, i, o.getString("s"), o.getString("e"), o.getString("t"));
                          }
                      }
                      p(c).edit().putInt("n", a.length()).apply();
                  } catch (Exception x) {
                  }
              }

              public static class Alarm extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      int i = in.getIntExtra("i", 0);
                      String s = in.getStringExtra("s");
                      String e = in.getStringExtra("e");
                      String t = in.getStringExtra("t");
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel("r", "Routine", NotificationManager.IMPORTANCE_HIGH));
                      PendingIntent open = PendingIntent.getActivity(c, 0,
                              new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                      Notification n = new Notification.Builder(c, "r")
                              .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                              .setContentTitle(t)
                              .setContentText(s + " - " + e)
                              .setContentIntent(open)
                              .setAutoCancel(true)
                              .build();
                      nm.notify(i, n);
                      set(c, i, s, e, t);
                  }
              }

              public static class Boot extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      all(c);
                      RoutineWidget.refreshAll(c);
                  }
              }
          }
          EOF_4
          cat > app/src/main/java/com/routine/app/RoutineWidget.java <<'EOF_WIDGETJAVA'
          package com.routine.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.widget.RemoteViews;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class RoutineWidget extends AppWidgetProvider {
              protected int style() { return WidgetArt.HERO; }

              public static class Gaming extends RoutineWidget {
                  protected int style() { return WidgetArt.GAMING; }
              }

              public static class Cinema extends RoutineWidget {
                  protected int style() { return WidgetArt.CINEMA; }
              }

              public static class Serie extends RoutineWidget {
                  protected int style() { return WidgetArt.SERIE; }
              }

              public static class Mini extends RoutineWidget {
                  protected int style() { return WidgetArt.MINI; }
              }

              public static class Compact extends RoutineWidget {
                  protected int style() { return WidgetArt.COMPACT; }
              }

              // L'ordre correspond aux constantes WidgetArt (HERO, GAMING, CINEMA, SERIE, MINI, COMPACT)
              static final Class<?>[] KINDS = {RoutineWidget.class, Gaming.class, Cinema.class,
                      Serie.class, Mini.class, Compact.class};

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) draw(c, m, id, style());
                  schedule(c);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context c, AppWidgetManager m, int id, Bundle o) {
                  draw(c, m, id, style());
              }

              @Override
              public void onEnabled(Context c) {
                  schedule(c);
              }

              @Override
              public void onDisabled(Context c) {
                  if (!any(c)) cancel(c);
              }

              public static void refreshAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  boolean any = false;
                  for (int i = 0; i < KINDS.length; i++) {
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, KINDS[i]));
                      for (int id : ids) {
                          draw(c, m, id, i);
                          any = true;
                      }
                  }
                  if (any) schedule(c);
                  else cancel(c);
              }

              static boolean any(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  for (Class<?> k : KINDS) {
                      if (m.getAppWidgetIds(new ComponentName(c, k)).length > 0) return true;
                  }
                  return false;
              }

              static List<WidgetModel.Block> load(Context c) {
                  List<WidgetModel.Block> l = new ArrayList<WidgetModel.Block>();
                  try {
                      JSONArray a = new JSONArray(c.getSharedPreferences("r", 0).getString("d", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          l.add(new WidgetModel.Block(WidgetModel.minutes(o.optString("s", "0:0")),
                                  WidgetModel.minutes(o.optString("e", "0:0")), o.optString("t", "")));
                      }
                  } catch (Exception ignored) {
                  }
                  return l;
              }

              static void draw(Context c, AppWidgetManager m, int id, int style) {
                  try {
                      Bundle o = m.getAppWidgetOptions(id);
                      float density = c.getResources().getDisplayMetrics().density;
                      boolean land = c.getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE;
                      float w, h;
                      if (land) {
                          w = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH, 0);
                          h = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                      } else {
                          w = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
                          h = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
                      }
                      if (w < 40) w = WidgetArt.REF_W[style];
                      if (h < 30) h = WidgetArt.REF_H[style];
                      Calendar cal = Calendar.getInstance();
                      WidgetModel.State st = WidgetModel.compute(load(c),
                              cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE), cal.get(Calendar.SECOND));
                      Bitmap b = WidgetArt.render(style, w, h, density, st);
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.routine_widget);
                      v.setImageViewBitmap(R.id.widget_img, b);
                      v.setContentDescription(R.id.widget_img, st.desc());
                      PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class),
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      v.setOnClickPendingIntent(R.id.widget_root, open);
                      m.updateAppWidget(id, v);
                  } catch (Exception ignored) {
                  }
              }

              static PendingIntent tickIntent(Context c) {
                  return PendingIntent.getBroadcast(c, 9001, new Intent(c, Tick.class),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  long now = System.currentTimeMillis();
                  long at = now - now % 60000L + 60500L;
                  PendingIntent p = tickIntent(c);
                  try {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC, at, p);
                  } catch (SecurityException e) {
                      am.set(AlarmManager.RTC, at, p);
                  }
              }

              static void cancel(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(tickIntent(c));
              }

              public static class Tick extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      refreshAll(c);
                  }
              }
          }
          EOF_WIDGETJAVA
