      - name: Configurer Firebase (comptes en ligne)
        env:
          FB_API_KEY: ${{ vars.FB_API_KEY }}
          FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import os
          p = "app/src/main/assets/index.html"
          t = open(p, encoding="utf-8").read()
          t = t.replace("__FB_API_KEY__", os.environ.get("FB_API_KEY", "").strip())
          t = t.replace("__FB_PROJECT_ID__", os.environ.get("FB_PROJECT_ID", "").strip())
          open(p, "w", encoding="utf-8").write(t)
          PY
      - name: Version web (GitHub Pages)
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets
      - name: Cle de signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ]; then
            echo "Cle de signature : secrets GitHub"
            PASS="$KS_PASS_SECRET"
          else
            echo "Cle de signature : cle integree (aucun secret configure)"
            KS_B64=""
            PASS="NlXmfWJAM9ctuRZofPV0pUUU"
          fi
          echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/routine.p12"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
      - name: Compiler
        env:
          KS_FILE: ${{ runner.temp }}/routine.p12
          KS_ALIAS: routine
          VC: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk routine.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk routine.apk --title "Ma routine" --notes "APK de Ma routine"
  pages:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
