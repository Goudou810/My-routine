name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ecrire le projet
        run: |
          mkdir -p app/src/main/java/com/routine/app app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi app/src/main/res/layout app/src/main/res/xml
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Routine'
          include ':app'
          EOF_0
          cat > app/build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' }

          def ksFile = System.getenv('KS_FILE')

          android {
              namespace 'com.routine.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.routine.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 100 + (System.getenv('VC') ?: '0').toInteger()
                  versionName '1.2'
              }
              signingConfigs {
                  release {
                      if (ksFile) {
                          storeFile file(ksFile)
                          storeType 'PKCS12'
                          storePassword System.getenv('KS_PASS')
                          keyAlias System.getenv('KS_ALIAS')
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      if (ksFile) signingConfig signingConfigs.release
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF_1
