                          for (int i = 0; i < 4; i++) {
                              float y = 42 + i * 9;
                              cv.drawLine(14, y, 42, y, tl);
                              cv.drawLine(58, y, 86, y, tl);
                          }
                          cv.drawCircle(22f, 14f, 2.2f, blur(fill(W), 2));
                          cv.drawCircle(78f, 10f, 1.8f, blur(fill(W), 2));
                          cv.drawCircle(50f, 8f, 2.4f, blur(fill(W), 2));
                          break;
                      }
                      case WidgetModel.LANG: {
                          glow(50, 50, 52, al(A, 0x55));
                          Paint b1 = fill(W);
                          lg(b1, 6, 12, 66, 44, A, mix(A, B, 0.5f));
                          cv.drawRoundRect(new RectF(6, 12, 66, 44), 12, 12, b1);
                          cv.drawPath(path("M 16 42 L 14 54 L 28 42 Z"), fill(A));
                          Paint b2 = fill(W);
                          lg(b2, 34, 52, 94, 84, mix(A, B, 0.5f), B);
                          cv.drawRoundRect(new RectF(34, 52, 94, 84), 12, 12, b2);
                          cv.drawPath(path("M 84 82 L 88 94 L 72 82 Z"), fill(B));
                          txt("Hello", 36, 28, tp(W, 14, BOLD, CENTER));
                          txt("Bonjour", 64, 68, tp(W, 12, BOLD, CENTER));
                          break;
                      }
                      case WidgetModel.PAUSE: {
                          glow(50, 56, 52, al(A, 0x66));
                          Paint cup = fill(W);
                          lg(cup, 0, 44, 0, 90, W, mix(A, W, 0.4f));
                          cv.drawPath(path("M 22 44 L 68 44 L 68 66 C 68 80 58 88 45 88 C 32 88 22 80 22 66 Z"), cup);
                          cv.drawPath(path("M 68 50 L 76 50 C 90 50 90 72 76 72 L 66 72"), stroke(W, 4f));
                          cv.drawRoundRect(new RectF(12, 90, 80, 95), 2.5f, 2.5f, fill(al(A, 0xCC)));
                          String[] sm = {"M 34 36 C 30 28 38 24 34 14", "M 46 36 C 42 28 50 24 46 12", "M 58 36 C 54 28 62 24 58 14"};
                          for (String q : sm) {
                              cv.drawPath(path(q), blur(stroke(al(W, 0x99), 4f), 3));
                              cv.drawPath(path(q), stroke(al(W, 0xCC), 2.4f));
                          }
                          break;
                      }
                      case WidgetModel.WAKE: {
                          glow(50, 62, 60, al(A, 0x88));
                          Paint sun = fill(W);
                          lg(sun, 0, 38, 0, 86, A, B);
                          cv.drawPath(path("M 26 66 C 26 34 74 34 74 66 Z"), sun);
                          Paint ry = stroke(A, 2.6f);
                          for (int i = 0; i < 7; i++) {
                              float an = (float) Math.PI + i * (float) Math.PI / 6f;
                              float co = (float) Math.cos(an), si = (float) Math.sin(an);
                              cv.drawLine(50 + 32 * co, 62 + 32 * si, 50 + 42 * co, 62 + 42 * si, ry);
                          }
                                          cv.drawLine(10, 70, 90, 70, stroke(al(A, 0xAA), 1.8f));
                          cv.drawLine(24, 79, 76, 79, stroke(al(A, 0x77), 1.6f));
                          cv.drawLine(36, 88, 64, 88, stroke(al(A, 0x55), 1.4f));
                          break;
                      }
                      case WidgetModel.REVIEW: {
                          glow(50, 50, 54, al(A, 0x66));
                          cv.drawCircle(50f, 50f, 38f, fill(al(A, 0x33)));
                          cv.drawCircle(50f, 50f, 38f, stroke(A, 3f));
                          cv.drawCircle(50f, 50f, 26f, stroke(mix(A, B, 0.5f), 3f));
                          cv.drawCircle(50f, 50f, 14f, stroke(B, 3f));
                          cv.drawCircle(50f, 50f, 4f, fill(W));
                          Paint ar = stroke(W, 3f);
                          cv.drawLine(50, 50, 86, 14, ar);
                          cv.drawPath(path("M 86 14 L 95 13 M 86 14 L 87 5"), ar);
                          break;
                      }
                      default: {
                          glow(50, 50, 52, al(A, 0x55));
                          cv.drawCircle(50f, 50f, 36f, fill(0x14FFFFFF));
                          cv.drawCircle(50f, 50f, 36f, stroke(A, 3f));
                          Paint tk = stroke(al(W, 0xAA), 2f);
                          for (int i = 0; i < 12; i++) {
                              float an = i * (float) Math.PI / 6f;
                              float co = (float) Math.cos(an), si = (float) Math.sin(an);
                              cv.drawLine(50 + 29 * co, 50 + 29 * si, 50 + 33 * co, 50 + 33 * si, tk);
                          }
                          Paint hd = stroke(W, 3.4f);
                          cv.drawLine(50, 50, 50, 28, hd);
                          cv.drawLine(50, 50, 66, 58, hd);
                          cv.drawCircle(50f, 50f, 3f, fill(B));
                      }
                  }
                  cv.restore();
              }

              // ---------- styles ----------
              void hero() {
                  bg(th[0], th[1], th[2]);
                  glow(Wd * 0.80f, Hd * 0.45f, Wd * 0.38f, th[5]);
                  glow(Wd * 0.97f, Hd * 0.92f, Wd * 0.28f, th[6]);
                  for (int i = 0; i < 4; i++) {
                      float x0 = Wd - 118 + i * 14;
                      Path q = path("M " + (x0 + 6) + " 10 L " + (x0 + 14) + " 10 L " + (x0 + 8) + " 22 L " + x0 + " 22 Z");
                      cv.drawPath(q, fill(al(th[3], 0x30 + i * 0x10)));
                  }
                  scene(st.cat, Wd * 0.83f, Hd * 0.52f, Math.min(Wd * 0.34f, Hd * 0.74f));
                  header(14, 20, 18, 15, 0xFFFFFFFF, true);
                  float cy = (Hd + 4) / 2f, cx = 53f;
                  ring(cx, cy, 35f, 6f, st.progress, th[3], th[4], 0x33FFFFFF, true);
                  int ik = iconFor(st.cat);
                  icon(ik, cx, cy, 38, th[3], th[4], 2.4f);
                  icon(ik, cx, cy, 38, mix(th[3], 0xFFFFFFFF, 0.6f), mix(th[4], 0xFFFFFFFF, 0.5f), 1.7f);
                  float tx = 106f;
                  String pt = st.active ? "En cours · " + st.pill : st.pill;
                  pill(tx, cy - 27, 22, pt, 12f, al(th[3], 0x44), al(th[3], 0x44), mix(th[3], 0xFFFFFFFF, 0.55f), ik, al(th[3], 0x88));
                  Paint tt = tp(0xFFFFFFFF, 26, BOLD, LEFT);
                  txt(fit(st.title, tt, Wd * 0.70f - tx), tx, cy + 2, tt);
                  clockRow(tx, cy + 30, 15, 16, 0xFFEEF0FF);
                  Paint tg = tp(mix(th[3], 0xFFFFFFFF, 0.65f), 12.5f, REG, LEFT);
                  String tag = fit(st.tagline, tg, Wd * 0.72f - 40);
                  txt(tag, 14, Hd - 16, tg);
                  icon(I_TARGET, 14 + tg.measureText(tag) + 12, Hd - 16, 15, th[3], th[4], 1.8f);
              }

              void card(float artX, float artY, float artS) {
                  bg(th[0], th[1], th[2]);
                  glow(Wd * 0.85f, Hd * 0.45f, Wd * 0.5f, th[5]);
                  glow(Wd * 0.1f, Hd * 1.0f, Wd * 0.4f, th[6]);
                  scene(st.cat, artX, artY, artS);
              }

              void tile(float cy, float sz) {
                  RectF tile = new RectF(12, cy - sz / 2, 12 + sz, cy + sz / 2);
                  Paint tl = fill(0xFFFFFFFF);
                  lg(tl, 12, cy + sz / 2, 12 + sz, cy - sz / 2, th[3], th[4]);
                  cv.drawRoundRect(tile, 11, 11, tl);
                  icon(iconFor(st.cat), 12 + sz / 2, cy, sz * 0.62f, onAcc(), onAcc(), 1.8f);
              }

              void v1() {
                  card(Wd - 30, 56f, 52f);
                  cv.drawPath(path("M " + (Wd - 84) + " 0 L " + (Wd - 40) + " 0 L " + (Wd - 70) + " 40 L " + (Wd - 114) + " 40 Z"), fill(al(th[3], 0x33)));
                  cv.drawPath(path("M " + (Wd - 52) + " 0 L " + (Wd - 24) + " 0 L " + (Wd - 46) + " 28 L " + (Wd - 74) + " 28 Z"), fill(al(th[4], 0x55)));
                  cv.drawPath(path("M " + (Wd - 110) + " " + Hd + " C " + (Wd - 60) + " " + (Hd - 6) + " " + (Wd - 20) + " " + (Hd - 30) + " " + Wd + " " + (Hd - 58) + " L " + Wd + " " + Hd + " Z"), fill(al(th[4], 0x66)));
                  cv.drawPath(path("M " + (Wd - 70) + " " + Hd + " C " + (Wd - 40) + " " + (Hd - 4) + " " + (Wd - 14) + " " + (Hd - 18) + " " + Wd + " " + (Hd - 34) + " L " + Wd + " " + Hd + " Z"), fill(al(th[3], 0x77)));
                  header(12, 18, 15, 12, 0xFFFFFFFF, true);
                  tile(57, 42);
                  Paint tt = tp(0xFFFFFFFF, 16, BOLD, LEFT);
                  txt(fit(st.title, tt, Wd - 64 - 52), 64, 50, tt);
                  clockRow(64, 70, 12, 11.5f, 0xFFEEF0FF);
                  float by = Hd - 38;
                  Paint lab = tp(0xFFFFFFFF, 11, BOLD, RIGHT);
                  float lw = lab.measureText(st.pill);
                  RectF track = new RectF(12, by - 3, Wd - 20 - lw, by + 3);
                  cv.drawRoundRect(track, 3, 3, fill(0x44000000));
                  if (st.progress > 0.01f) {
                      RectF fl = new RectF(12, by - 3, 12 + track.width() * st.progress, by + 3);
                      Paint fp = fill(0xFFFFFFFF);
                      lg(fp, 12, 0, track.right, 0, th[3], th[4]);
                      cv.drawRoundRect(fl, 3, 3, fp);
                  }
                  txt(st.pill, Wd - 12, by, lab);
                  Paint mo = tp(mix(th[3], 0xFFFFFFFF, 0.25f), 22, SCRIPT, LEFT);
                  txt(st.motto, 12, Hd - 16, mo);
                  icon(iconFor(st.cat), 12 + mo.measureText(st.motto) + 14, Hd - 16, 15, th[3], th[4], 1.8f);
              }

              void v2() {
                  card(Wd - 32, Hd * 0.60f, 62f);
                  header(12, 18, 15, 12, 0xFFFFFFFF, true);
                  RectF tl = new RectF(12, 36, 54, 78);
                  cv.drawRoundRect(tl, 11, 11, fill(0x55000000));
                  cv.drawRoundRect(tl, 11, 11, stroke(0x33FFFFFF, 1f));
                  icon(iconFor(st.cat), 33, 57, 28, th[3], th[4], 1.9f);
                  Paint tt = tp(0xFFFFFFFF, 16, BOLD, LEFT);
                  txt(fit(st.title, tt, Wd - 64 - 44), 64, 50, tt);
                  clockRow(64, 70, 12, 11.5f, 0xFFF2F2FF);
                  pill(12, Hd - 22, 26, st.pill, 13, th[3], th[4], onAcc(), 0, 0);
              }

              void v3() {
                  card(Wd - 32, Hd * 0.62f, 60f);
                  header(12, 18, 15, 12, 0xFFFFFFFF, false);
                  cv.save();
                  cv.rotate(-8f, Wd - 44, 18);
                  txt(st.motto, Wd - 44, 18, blur(tp(th[4], 15, SCRIPT, CENTER), 4));
                  txt(st.motto, Wd - 44, 18, tp(mix(th[4], 0xFFFFFFFF, 0.85f), 15, SCRIPT, CENTER));
                  cv.restore();
                  ring(35, 58, 20, 4.5f, st.progress, th[3], th[4], 0x33FFFFFF, true);
                  int ik = iconFor(st.cat) == I_FILM ? I_PLAY : iconFor(st.cat);
                  icon(ik, 35, 58, 20, 0xFFFFFFFF, 0xFFFFFFFF, 1.8f);
                  Paint tt = tp(0xFFFFFFFF, 18, BOLD, LEFT);
                  txt(fit(st.title, tt, Wd - 66 - 40), 66, 50, tt);
                  clockRow(66, 70, 12, 11.5f, 0xFFEEF0FF);
                  pill(12, Hd - 22, 26, st.pill, 13, th[3], th[4], onAcc(), 0, 0);
              }

              void v4() {
                  bg(th[0], th[1], th[2]);
                  glow(Wd * 0.2f, Hd * 0.6f, Wd * 0.3f, al(th[5], 0x44));
                  scene(st.cat, Wd - 56, Hd * 0.5f, Hd * 0.95f);
                  cv.drawRect(0, 0, Wd, Hd, fill(al(th[1], 0xC8)));
                  header(14, 15, 13, 11.5f, 0xB3FFFFFF, true);
                  float cy = Hd * 0.58f;
                  ring(40, cy, 22, 4.5f, st.progress, th[3], th[4], 0x33FFFFFF, true);
                  icon(iconFor(st.cat), 40, cy, 24, mix(th[3], 0xFFFFFFFF, 0.7f), mix(th[4], 0xFFFFFFFF, 0.6f), 1.8f);
                  float tx = 78f;
                  float pw = pillW(st.pill, 12.5f, true);
                  Paint tt = tp(0xFFFFFFFF, 17, BOLD, LEFT);
                  txt(fit(st.title, tt, Wd - tx - pw - 28), tx, cy - 12, tt);
                  clockRow(tx, cy + 7, 12, 12.5f, 0xCCFFFFFF);
                  pill(Wd - 14 - pw, cy - 8, 26, st.pill, 12.5f, al(th[3], 0x33), al(th[4], 0x33), 0xFFFFFFFF, I_STOP, al(th[3], 0xCC));
                  float by = Hd - 11;
                  RectF track = new RectF(tx, by - 2.5f, Wd - 14, by + 2.5f);
                  cv.drawRoundRect(track, 2.5f, 2.5f, fill(0x33FFFFFF));
                  if (st.progress > 0.01f) {
                      Paint fp = fill(0xFFFFFFFF);
                      lg(fp, tx, 0, Wd - 14, 0, th[3], th[4]);
                      cv.drawRoundRect(new RectF(tx, by - 2.5f, tx + track.width() * st.progress, by + 2.5f), 2.5f, 2.5f, fp);
                  }
              }

              void v5() {
                  bg(th[0], th[1], th[2]);
                  glow(Wd * 0.85f, Hd * 0.5f, Wd * 0.4f, al(th[5], 0x88));
                  scene(st.cat, Wd - 46, Hd * 0.5f, Hd * 1.05f);
                  cv.drawRect(0, 0, Wd, Hd, fill(al(th[1], 0xC0)));
                  float cy = Hd / 2f;
                  tile(cy, 52);
                  float tx = 76f;
                  txt("Ma routine", tx, cy - 20, tp(0xBBFFFFFF, 11, REG, LEFT));
                  Paint tt = tp(0xFFFFFFFF, 17, BOLD, LEFT);
                  txt(fit(st.title, tt, Wd - tx - 36), tx, cy, tt);
                  clockRow(tx, cy + 20, 12, 12, 0xDDFFFFFF);
                  icon(I_CHEV, Wd - 18, cy, 16, 0xFFFFFFFF, 0xFFFFFFFF, 2.2f);
              }
          }
