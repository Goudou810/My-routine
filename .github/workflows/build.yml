          cat > app/src/main/assets/index.html <<'EOF_5'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Ma routine</title>
          <style>
          :root{--bg:#070b1c;--sf:rgba(255,255,255,.06);--ln:rgba(255,255,255,.12);--ink:#f2f5ff;--mu:#9aa6d0;--c1:#b06bff;--c2:#3b8cff;color-scheme:dark}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0}
          body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
          button{font:inherit;color:inherit}
          .fx{position:fixed;inset:0;overflow:hidden;pointer-events:none}
          .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;transition:background-color 1.6s ease}
          .o1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:var(--c1);animation:f1 18s ease-in-out infinite alternate}
          .o2{width:60vmax;height:60vmax;right:-28vmax;bottom:-22vmax;background:var(--c2);animation:f2 22s ease-in-out infinite alternate}
          .o3{width:34vmax;height:34vmax;left:30%;top:38%;background:var(--c1);opacity:.18;animation:f3 26s ease-in-out infinite alternate}
          @keyframes f1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
          @keyframes f2{to{transform:translate(-10vmax,-8vmax) scale(1.2)}}
          @keyframes f3{to{transform:translate(-14vmax,8vmax) scale(.8)}}
          .fx i{position:absolute;bottom:-12px;border-radius:50%;background:var(--c2);opacity:0;animation:rise linear infinite;transition:background-color 1.6s}
          @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-112vh);opacity:0}}
          .pg{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
          #home{z-index:1;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s}
          #home.off{transform:scale(.96);opacity:0;pointer-events:none}
          .wrap{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 30px}
          .top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
          .hi{font-size:13px;color:var(--mu);letter-spacing:.3px}
          .dt{font-size:20px;font-weight:700;margin-top:1px}
          #mb{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
          #mb:active{transform:scale(.9)}
          #mb svg{width:22px;height:22px;fill:var(--ink)}
          .menu{position:absolute;right:0;top:50px;min-width:200px;padding:6px;border-radius:16px;border:1px solid var(--ln);background:rgba(18,22,52,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .2s}
          .menu.on{opacity:1;transform:none;pointer-events:auto}
          .menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;border-radius:12px;text-align:left;font-size:15px}
          .menu button:active{background:var(--sf)}
          .menu b{font-size:18px;width:22px;text-align:center}
          .stage{position:relative;width:min(74vw,300px);aspect-ratio:1;margin:20px auto 6px}
          .stage svg{width:100%;height:100%;display:block;overflow:visible}
          #pg,#pgl{transition:stroke-dashoffset 1s linear}
          .tk{stroke:var(--ln);stroke-width:2;stroke-linecap:round;transition:stroke .4s}
          .tk.on{stroke:var(--c2)}
          .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
          .ic{font-size:clamp(34px,11vw,46px);line-height:1;filter:drop-shadow(0 0 14px var(--c1));animation:bob 3.4s ease-in-out infinite}
          @keyframes bob{50%{transform:translateY(-6px) scale(1.06)}}
          .t{font-size:clamp(34px,11vw,46px);font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.05}
          .t small{font-size:.38em;font-weight:700;color:var(--c2);margin-left:3px;letter-spacing:0}
          .st{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--c1);display:flex;align-items:center;gap:6px}
          .st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 0 var(--c1);animation:pl 1.8s infinite}
          @keyframes pl{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
          .info{text-align:center;margin-top:10px}
          .ct{font-size:clamp(26px,8vw,34px);font-weight:800;line-height:1.15;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px;animation:pop .5s ease}
          @keyframes pop{from{opacity:0;transform:translateY(8px)}}
          .cr{font-size:18px;color:var(--mu);font-variant-numeric:tabular-nums;margin-top:2px}
          .cl{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;box-shadow:0 8px 24px -6px var(--c1)}
          .tg{margin:14px auto 0;max-width:320px;color:#c3cdf5;font-style:italic;font-size:15px}
          .cards{display:grid;gap:12px;margin-top:24px}
          .card{border:1px solid var(--ln);background:var(--sf);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:14px 16px;animation:pop .6s ease}
          .lb{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--mu);text-transform:uppercase}
          .nx{display:flex;align-items:center;gap:14px;margin-top:8px}
          .nx .e{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--c1),var(--c2))}
          .nx .n{font-weight:700;font-size:17px}
          .nx .w{color:var(--mu);font-size:13px;margin-top:1px}
          .tl{position:relative;height:14px;margin-top:12px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden}
          .tl i{position:absolute;top:0;bottom:0;opacity:.85;border-right:1px solid var(--bg)}
          .mk{position:absolute;top:-3px;width:4px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 12px #fff;transition:left 1s linear}
          .tr{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}
          #rt{z-index:3;background:var(--bg);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
          #rt.on{transform:none;visibility:visible}
          .rh{display:flex;align-items:center;gap:10px;position:sticky;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:rgba(7,11,28,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:2;border-bottom:1px solid var(--ln)}
          .rh button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:flex;align-items:center;justify-content:center}
          .rh svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
          .rh h1{font-size:22px;margin:0}
          main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
          .sub{margin:0 0 14px;color:var(--mu);font-size:14px}
          #now{padding:10px 12px;margin-bottom:14px;border-left:4px solid var(--c1);background:var(--sf);border-radius:0 12px 12px 0;font-size:15px}
          .row{display:grid;grid-template-columns:88px 1fr;gap:10px;margin-bottom:8px}
          .tm{display:flex;flex-direction:column;gap:2px}
          input{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:8px;padding:3px 4px;min-width:0;color-scheme:dark}
          input:focus{outline:none;border-color:var(--ln);background:rgba(255,255,255,.05)}
          input[type=time]{width:88px;font-size:15px}
          .tm input:first-child{font-weight:700}
          .tm input:last-child{color:var(--mu)}
          .bl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 6px;padding:8px 6px 8px 12px;border-left:4px solid var(--c);border-radius:0 14px 14px 0;background:var(--sf);background:color-mix(in srgb,var(--c) 14%,transparent)}
          .bl.now{box-shadow:0 0 0 2px var(--c),0 0 22px -4px var(--c)}
          .t2{width:100%;font-weight:600}
          .d{grid-column:1;display:flex;gap:12px;align-items:center;color:var(--mu);font-size:13px;padding-left:4px}
          .d input{margin:0}
          .x{grid-row:1/3;grid-column:2;border:0;background:none;color:var(--mu);font-size:22px;padding:6px 10px}
          .bar{display:flex;gap:8px;margin-top:16px}
          .b{flex:1;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
          .b.p{background:linear-gradient(90deg,var(--c1),var(--c2));border-color:transparent;font-weight:700}
          .note{margin-top:12px;color:var(--mu);font-size:13px}
          .au{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(7,11,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow-y:auto}
          .au.on{display:flex}
          .ac{width:100%;max-width:380px;border:1px solid var(--ln);background:rgba(18,22,52,.85);border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
          .al{font-size:44px;filter:drop-shadow(0 0 14px var(--c1))}
          .ac h2{margin:6px 0 4px;font-size:24px}
          .ac .sub{margin:0 0 16px}
          .ac input{display:block;width:100%;margin:0 0 10px;padding:13px 14px;border:1px solid var(--ln);background:rgba(255,255,255,.06);border-radius:14px;font-size:16px}
          .ac .b{display:block;width:100%;margin-top:10px}
          .lk{border:0;background:none;color:var(--c2);margin-top:14px;padding:6px;font-size:14px}
          .am{min-height:20px;margin-top:12px;font-size:14px;color:#ff8a8a}
          .am.ok{color:#7ee0b0}
          .who{padding:8px 14px;font-size:13px;color:var(--ink);border-bottom:1px solid var(--ln);margin-bottom:4px;word-break:break-all}
          .who small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style>
          </head>
          <body>
          <div class="fx" id="fx"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

          <div id="home" class="pg"><div class="wrap">
           <div class="top">
            <div><div class="hi" id="hi"></div><div class="dt" id="dt"></div></div>
            <button id="mb" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button>
            <div class="menu" id="menu">
             <div class="who" id="who" style="display:none"><div id="wm"></div><small id="sy"></small></div>
              <button id="m1"><b>🗓️</b>Routine</button>
             <button id="m2"><b>➕</b>Ajouter un bloc</button>
              <button id="m3" style="display:none"><b>🚪</b>Se déconnecter</button>
            </div>
           </div>
           <div class="stage">
            <svg viewBox="0 0 220 220" aria-hidden="true">
             <defs>
              <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop id="sA" offset="0" stop-color="#b06bff"/><stop id="sB" offset="1" stop-color="#3b8cff"/></linearGradient>
              <filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
             </defs>
             <g id="tks"></g>
             <circle cx="110" cy="110" r="90" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)" stroke-width="10"/>
             <circle id="pgl" cx="110" cy="110" r="90" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="565.49" stroke-dashoffset="565.49" filter="url(#bl)" opacity=".8"/>
             <circle id="pg" cx="110" cy="110" r="90" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="565.49" stroke-dashoffset="565.49"/>
            </svg>
            <div class="face">
             <div class="ic" id="ic">⏱️</div>
             <div class="t"><span id="clk">00:00</span><small id="sec">:00</small></div>
             <div class="st" id="st">EN COURS</div>
            </div>
           </div>
           <div class="info">
            <div class="ct" id="ct"></div>
            <div class="cr" id="cr"></div>
            <div class="cl" id="cl"></div>
            <div class="tg" id="tg"></div>
           </div>
           <div class="cards">
            <div class="card" id="nxc"><div class="lb">Ensuite</div>
             <div class="nx"><div class="e" id="ne">⏱️</div><div><div class="n" id="nn"></div><div class="w" id="nw"></div></div></div></div>
            <div class="card"><div class="lb">Ma journée <span id="dp"></span></div>
             <div class="tl" id="tl"></div>
             <div class="tr"><span id="t0"></span><span id="t1"></span></div></div>
           </div>
          </div></div>

          <div id="rt" class="pg">
           <div class="rh"><button id="bk" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Routine</h1></div>
           <main>
            <p class="sub" id="sub"></p>
            <div id="now"></div>
            <div id="list"></div>
            <div class="bar"><button class="b p" id="add">Ajouter un bloc</button><button class="b" id="rst">Réinitialiser</button></div>
            <p class="note">Touche une heure ou un titre pour le modifier. Commence un titre par « Pause » pour le griser. Décoche « Notification » pour couper le rappel d'un bloc.</p>
           </main>
          </div>

          <div id="auth" class="au"><div class="ac">
           <div class="al">⏱️</div>
           <h2 id="at">Connexion</h2>
           <p class="sub" id="as"></p>
           <div id="af">
            <input id="ae" type="email" placeholder="Email" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false">
            <input id="ap" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
            <button class="b p" id="ago">Se connecter</button>
            <button class="b" id="asw">Créer un compte</button>
            <button class="lk" id="afg">Mot de passe oublié ?</button>
           </div>
           <div id="av" style="display:none">
            <button class="b p" id="ach">J'ai vérifié mon email</button>
            <button class="b" id="are">Renvoyer l'email</button>
            <button class="lk" id="alo">Changer de compte</button>
           </div>
           <div class="am" id="am"></div>
          </div></div>

          <script>
          const KEY="routine-v1";
          const DEF=[["06:00","06:30","Réveil"],["06:30","07:15","Anglais"],["07:15","07:45","Pause petit-déjeuner"],["07:45","08:45","Lecture"],["08:45","09:00","Pause"],["09:00","09:45","Anglais (écoute et pratique)"],["09:45","10:00","Pause"],["10:00","12:00","Trading"],["12:00","13:00","Pause déjeuner"],["13:00","14:30","Jeu vidéo"],["14:30","14:45","Pause"],["14:45","16:15","Série ou film"],["16:15","16:30","Pause"],["16:30","17:30","Lecture"],["17:30","18:30","Pause dîner"],["18:30","19:30","Série ou film"],["19:30","19:45","Pause"],["19:45","20:30","Lecture au calme"],["20:30","21:00","Bilan OODA"]];
          const CATS=[
           {k:"pause",m:/^pause|déjeuner|dejeuner|dîner|diner/,e:"☕",a:"#5eead4",b:"#38bdf8",t:"Respire. Recharge-toi."},
           {k:"game",m:/jeu|game|gaming/,e:"🎮",a:"#b06bff",b:"#3b8cff",t:"Concentre-toi. Le meilleur est devant toi."},
           {k:"film",m:/film|série|serie|ciné|cine/,e:"🎬",a:"#ffb347",b:"#ff5a1f",t:"Détends-toi et profite du moment."},
           {k:"trade",m:/trad/,e:"📈",a:"#34e0a1",b:"#19a6ff",t:"Respecte ton plan, un trade à la fois."},
           {k:"read",m:/lecture|livre|read/,e:"📖",a:"#ffd166",b:"#ef8354",t:"Une page après l'autre."},
           {k:"lang",m:/anglais|english|langue/,e:"🗣️",a:"#ff6bd6",b:"#6b8cff",t:"Chaque jour, un peu mieux."},
           {k:"wake",m:/réveil|reveil|lever/,e:"🌅",a:"#ffd36b",b:"#ff7a59",t:"Une belle journée t'attend."},
           {k:"review",m:/bilan|ooda/,e:"🎯",a:"#a78bfa",b:"#6366f1",t:"Observer, s'orienter, décider, agir."}];
          const DEFC={k:"gen",e:"⏱️",a:"#60a5fa",b:"#818cf8",t:"Reste concentré sur l'essentiel."};
          const $=id=>document.getElementById(id);
          const pad=n=>String(n).padStart(2,"0");
          const mn=t=>{const p=(t||"").split(":");return(+p[0]||0)*60+(+p[1]||0)};
          const hm=n=>{n=((n%1440)+1440)%1440;return pad(Math.floor(n/60))+":"+pad(n%60)};
          const fmt=d=>d<=0?"0 min":d<60?d+" min":Math.floor(d/60)+" h"+(d%60?" "+pad(d%60):"");
          const fmtd=d=>d<=0?"fin avant le début":fmt(d);
          const cat=t=>{t=(t||"").toLowerCase();for(const c of CATS)if(c.m.test(t))return c;return DEFC};
          const fresh=()=>DEF.map(([s,e,t])=>({s,e,t,n:true}));
          function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d)&&d.length)return d}catch(e){}return fresh()}
          function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}try{if(window.Android)Android.save(JSON.stringify(data))}catch(e){}}
          function save(){persist();wr(TS,String(Date.now()));queuePush()}
          function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}
          function inp(type,v,label){const e=mk("input");e.type=type;e.value=v||"";e.setAttribute("aria-label",label);return e}
          let data=load(),rows=[],curK="",litN=-1;

          /* ---------- Routine (édition) ---------- */
          function render(){
           data.sort((a,b)=>mn(a.s)-mn(b.s));
           const L=$("list");L.innerHTML="";rows=[];
           data.forEach((x,i)=>{
            const r=mk("div","row"),tm=mk("div","tm");
            const a=inp("time",x.s,"Début"),b=inp("time",x.e,"Fin");
            tm.append(a,b);
            const bl=mk("div","bl");bl.style.setProperty("--c",cat(x.t).a);
            const t=inp("text",x.t,"Titre");t.className="t2";
            const d=mk("div","d"),sp=mk("span");sp.textContent=fmtd(mn(x.e)-mn(x.s));
            const lb=mk("label"),cb=inp("checkbox","","Notification");cb.checked=x.n!==false;
            cb.onchange=()=>{x.n=cb.checked;save()};
            lb.append(cb," Notification");d.append(sp,lb);
            const del=mk("button","x");del.textContent="×";del.setAttribute("aria-label","Supprimer ce bloc");
            a.onchange=()=>{x.s=a.value||x.s;commit()};
            b.onchange=()=>{x.e=b.value||x.e;commit()};
            t.onchange=()=>{x.t=t.value;commit()};
            del.onclick=()=>{data.splice(i,1);commit()};
            bl.append(t,del,d);r.append(tm,bl);L.append(r);rows.push(bl);
           });
           $("sub").textContent=data.length?"Lever à "+data[0].s+", coucher à "+data[data.length-1].e:"Aucun bloc pour l'instant";
           buildTl();tick();home();
          }
          function commit(){save();render()}
          function tick(){
           const n=new Date(),c=n.getHours()*60+n.getMinutes();let k=-1;
           data.forEach((x,i)=>{const on=mn(x.s)<=c&&c<mn(x.e);if(on&&k<0)k=i;if(rows[i])rows[i].classList.toggle("now",on&&k===i)});
           $("now").textContent=k>=0?"Maintenant : "+data[k].t+", jusqu'à "+data[k].e:"Aucun bloc en cours";
          }
          function addBlock(){const s=Math.min(data.length?mn(data[data.length-1].e):720,1409);data.push({s:hm(s),e:hm(s+30),t:"Nouvelle activité",n:true});commit()}
          $("add").onclick=addBlock;
          let armed=0;
          $("rst").onclick=()=>{const b=$("rst");if(!armed){armed=1;b.textContent="Confirmer la réinitialisation";setTimeout(()=>{armed=0;b.textContent="Réinitialiser"},3000)}else{armed=0;b.textContent="Réinitialiser";data=fresh();commit()}};

          /* ---------- Navigation : menu 3 points + page Routine ---------- */
          function showRt(on){$("rt").classList.toggle("on",on);$("home").classList.toggle("off",on);if(on)$("rt").scrollTop=0}
          window.addEventListener("hashchange",()=>showRt(location.hash==="#routine"));
          function openRt(){closeMenu();location.hash="routine"}
          function closeMenu(){$("menu").classList.remove("on")}
          $("mb").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("on")};
          document.addEventListener("click",e=>{if(!$("menu").contains(e.target))closeMenu()});
          $("m1").onclick=openRt;
          $("m2").onclick=()=>{openRt();setTimeout(()=>{addBlock();const L=$("list");$("rt").scrollTop=$("rt").scrollHeight},120)};
          $("bk").onclick=()=>{if(location.hash==="#routine")history.back();else showRt(false)};

          /* ---------- Accueil dynamique ---------- */
          const NS="http://www.w3.org/2000/svg",CIRC=565.49;
          for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?102:99,l=document.createElementNS(NS,"line");l.setAttribute("class","tk");l.setAttribute("x1",110+r1*Math.sin(a));l.setAttribute("y1",110-r1*Math.cos(a));l.setAttribute("x2",110+107*Math.sin(a));l.setAttribute("y2",110-107*Math.cos(a));$("tks").append(l)}
          const tkEls=$("tks").children;
          for(let i=0;i<16;i++){const p=mk("i"),s=2+Math.random()*3.5;p.style.cssText="left:"+Math.random()*100+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(10+Math.random()*14)+"s;animation-delay:-"+Math.random()*20+"s";$("fx").append(p)}
          function theme(c){
           if(curK===c.k)return;curK=c.k;
           const r=document.documentElement.style;r.setProperty("--c1",c.a);r.setProperty("--c2",c.b);
           $("sA").setAttribute("stop-color",c.a);$("sB").setAttribute("stop-color",c.b);
           $("ic").textContent=c.e;
           const t=$("ct");t.style.animation="none";void t.offsetWidth;t.style.animation="";
          }
          function buildTl(){
           const T=$("tl");T.innerHTML="";
           if(!data.length){$("t0").textContent="";$("t1").textContent="";return}
           const a=Math.min(...data.map(x=>mn(x.s))),b=Math.max(...data.map(x=>mn(x.e))),sp=Math.max(1,b-a);
           data.forEach(x=>{const i=mk("i");i.style.left=((mn(x.s)-a)/sp*100)+"%";i.style.width=(Math.max(0,mn(x.e)-mn(x.s))/sp*100)+"%";i.style.background=cat(x.t).a;T.append(i)});
           const m=mk("div","mk");m.id="mk";T.append(m);
           $("t0").textContent=hm(a);$("t1").textContent=hm(b);T.dataset.a=a;T.dataset.b=b;
          }
          function home(){
           const n=new Date(),c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;
           const h=n.getHours();
           $("hi").textContent=h<5||h>=18?"Bonsoir":h<12?"Bonjour":"Bon après-midi";
           let ds="";try{ds=n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}catch(e){}
           $("dt").textContent=ds?ds.charAt(0).toUpperCase()+ds.slice(1):"";
           $("clk").textContent=pad(n.getHours())+":"+pad(n.getMinutes());$("sec").textContent=":"+pad(n.getSeconds());
           const L=[...data].sort((a,b)=>mn(a.s)-mn(b.s));
           const T=$("tl"),ta=+T.dataset.a||0,tb=+T.dataset.b||1440,mk2=$("mk");
           const dp=Math.max(0,Math.min(1,(c-ta)/Math.max(1,tb-ta)));
           if(mk2)mk2.style.left="calc("+(dp*100)+"% - 2px)";
           $("dp").textContent=L.length?"· "+Math.round(dp*100)+" %":"";
           let k=-1;L.forEach((x,i)=>{if(k<0&&mn(x.s)<=c&&c<mn(x.e))k=i});
           const live=k>=0;let sh=k,p=0;
           if(live){p=(c-mn(L[k].s))/Math.max(1,mn(L[k].e)-mn(L[k].s))}
           else{sh=L.findIndex(x=>mn(x.s)>c);if(sh<0&&L.length)sh=0}
           const x=sh>=0?L[sh]:null;
           if(!x){theme(DEFC);$("ct").textContent="Aucune activité";$("cr").textContent="";$("cl").style.display="none";$("tg").textContent="Ajoute tes blocs via le menu ⋮";$("nxc").style.display="none";$("st").textContent="LIBRE";return}
           const ct=cat(x.t);theme(ct);
           $("ct").textContent=x.t;$("cr").textContent=x.s+" – "+x.e;$("tg").textContent=ct.t;
           $("st").textContent=live?"EN COURS":"ENSUITE";
           const cl=$("cl");cl.style.display="";
           if(live)cl.textContent="Il reste "+fmt(Math.ceil(mn(x.e)-c));
           else{let dl=mn(x.s)-c;if(dl<0)dl+=1440;cl.textContent="Commence dans "+fmt(Math.ceil(dl))}
           const off=CIRC*(1-p);$("pg").style.strokeDashoffset=off;$("pgl").style.strokeDashoffset=off;
           const lit=Math.floor(p*60);
           if(lit!==litN){litN=lit;for(let i=0;i<60;i++)tkEls[i].classList.toggle("on",i<lit)}
           const y=L.length>1?L[(sh+1)%L.length]:null;
           $("nxc").style.display=y?"":"none";
           if(y){const cy=cat(y.t);$("ne").textContent=cy.e;$("nn").textContent=y.t;$("nw").textContent="à "+y.s+" · durée "+fmt(mn(y.e)-mn(y.s))}
          }
          /* ---------- Compte + sauvegarde en ligne (Firebase, API REST) ---------- */
          const FB_KEY="__FB_API_KEY__",FB_PROJ="__FB_PROJECT_ID__";
          const CLOUD=/^AIza[\w-]{30,}$/.test(FB_KEY)&&/^[a-z0-9][a-z0-9-]{3,}$/.test(FB_PROJ);
          const SES="routine-session",OWN="routine-owner",TS="routine-ts";
          const IDT="https://identitytoolkit.googleapis.com/v1/accounts:";
          const AUTH_BAD=/TOKEN_EXPIRED|USER_NOT_FOUND|USER_DISABLED|INVALID_REFRESH_TOKEN|CREDENTIAL_TOO_OLD|INVALID_GRANT/;
