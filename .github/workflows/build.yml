          cat > app/src/main/java/com/routine/app/WidgetModel.java <<'EOF_WMODEL'
          package com.routine.app;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class WidgetModel {
              public static final int GENERIC = 0, GAME = 1, FILM = 2, TRADE = 3, READ = 4,
                      LANG = 5, PAUSE = 6, WAKE = 7, REVIEW = 8;

              public static class Block {
                  public int s, e;
                  public String t = "";
                  public Block(int s, int e, String t) { this.s = s; this.e = e; this.t = t; }
              }

              public static class State {
                  public boolean empty, active;
                  public int cat;
                  public float progress;
                  public String title = "", time = "", pill = "", status = "", tagline = "", motto = "";

                  public String desc() {
                      if (empty) return "Ma routine, aucune activité";
                      return "Ma routine, " + status + ", " + title + ", " + time + ", " + pill;
                  }
              }

              public static int minutes(String v) {
                  try {
                      String[] p = v.split(":");
                      return Integer.parseInt(p[0].trim()) * 60 + Integer.parseInt(p[1].trim());
                  } catch (Exception e) {
                      return 0;
                  }
              }

              static String hm(int m) {
                  m = ((m % 1440) + 1440) % 1440;
                  return (m / 60 < 10 ? "0" : "") + (m / 60) + ":" + (m % 60 < 10 ? "0" : "") + (m % 60);
              }

              public static String fmt(int d) {
                  if (d < 60) return d + " min";
                  return (d / 60) + " h" + (d % 60 != 0 ? " " + (d % 60 < 10 ? "0" : "") + (d % 60) : "");
              }

              public static int category(String title) {
                  String t = title == null ? "" : title.toLowerCase();
                  if (t.startsWith("pause") || t.contains("déjeuner") || t.contains("dejeuner") || t.contains("dîner") || t.contains("diner")) return PAUSE;
                  if (t.contains("jeu") || t.contains("game") || t.contains("gaming")) return GAME;
                  if (t.contains("film") || t.contains("série") || t.contains("serie") || t.contains("ciné") || t.contains("cine")) return FILM;
                  if (t.contains("trad")) return TRADE;
                  if (t.contains("lecture") || t.contains("livre") || t.contains("read")) return READ;
                  if (t.contains("anglais") || t.contains("english") || t.contains("langue")) return LANG;
                  if (t.contains("réveil") || t.contains("reveil") || t.contains("lever")) return WAKE;
                  if (t.contains("bilan") || t.contains("ooda")) return REVIEW;
                  return GENERIC;
              }

              static String tagline(int c) {
                  switch (c) {
                      case GAME: return "Concentre-toi. Le meilleur est devant toi.";
                      case FILM: return "Détends-toi et profite du moment.";
                      case TRADE: return "Respecte ton plan, un trade à la fois.";
                      case READ: return "Une page après l'autre.";
                      case LANG: return "Chaque jour, un peu mieux.";
                      case PAUSE: return "Respire. Recharge-toi.";
                      case WAKE: return "Une belle journée t'attend.";
                      case REVIEW: return "Observer, s'orienter, décider, agir.";
                      default: return "Reste concentré sur l'essentiel.";
                  }
              }

              static String motto(int c) {
                  switch (c) {
                      case GAME: return "Level Up";
                      case FILM: return "Showtime";
                      case TRADE: return "Stay sharp";
                      case READ: return "Page turner";
                      case LANG: return "Keep going";
                      case PAUSE: return "Recharge";
                      case WAKE: return "Rise & shine";
                      case REVIEW: return "Debrief";
                      default: return "Focus";
                  }
              }

              public static State compute(List<Block> in, int nowMin, int nowSec) {
                  State st = new State();
                  if (in == null || in.isEmpty()) {
                      st.empty = true;
                      st.title = "Aucune activité";
                      st.time = "Ouvre Ma routine";
                      st.status = "Ma routine";
                      st.tagline = "Ajoute tes blocs dans l'app.";
                      st.motto = "Focus";
                      return st;
                  }
                  List<Block> l = new ArrayList<Block>(in);
                  Collections.sort(l, new Comparator<Block>() {
                      public int compare(Block a, Block b) { return a.s - b.s; }
                  });
                  float now = nowMin + nowSec / 60f;
                  Block cur = null, next = null;
                  for (Block b : l) {
                      if (b.s <= now && now < b.e) { cur = b; break; }
                  }
                  if (cur != null) {
                      st.active = true;
                      st.status = "En cours";
                      st.progress = Math.max(0f, Math.min(1f, (now - cur.s) / Math.max(1, cur.e - cur.s)));
                      int rem = (int) Math.ceil(cur.e - now);
                      st.pill = fmt(Math.max(1, rem));
                      fill(st, cur);
                      return st;
                  }
                  int delta = 0;
                  for (Block b : l) {
                      if (b.s > now) { next = b; delta = (int) Math.ceil(b.s - now); break; }
                  }
                  if (next == null) {
                      next = l.get(0);
